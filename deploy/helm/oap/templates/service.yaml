apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-oap-server
  labels:
    app: oap-server
    app.kubernetes.io/name: oap
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
  selector:
    app: oap-server
