apiVersion: oap.dev/v1alpha1
kind: Agent
metadata:
  name: ticket-assistant
  namespace: support
spec:
  owner: "group:support_platform"
  type: chat_agent
  riskTier: medium
  description: >
    Support operations agent that reads tickets, summarizes issues,
    looks up customers, posts to Slack, creates escalation issues,
    and updates ticket status. Governed by OAP policy.

  workloadIdentity:
    id: spiffe://oap.local/ns/support/sa/ticket-assistant
    type: spiffe
    trustDomain: oap.local
    attestationLevel: platform

  identityBindings:
    - type: spiffe
      provider: spire
      issuer: "https://spire.oap.local"
      jwksUri: "https://spire.oap.local/.well-known/jwks.json"
      subject: "spiffe://oap.local/ns/support/sa/ticket-assistant"
      audience: "oap-server"
    - type: oidc_client
      provider: keycloak
      issuer: "http://keycloak:8080/realms/oap-validation"
      subject: "support-agent"

  capabilities:
    - ticket.read
    - ticket.summarize
    - customer.read
    - message.send
    - escalation.issue.create
    - ticket.update
  framework: langchain
