apiVersion: oap.dev/v1alpha1
kind: AgentPolicy
metadata:
  name: support-ticket-agent-policy
  namespace: support
spec:
  subject:
    agent: "agent://support/ticket-assistant"

  rules:
    # Allow reading and summarizing assigned tickets with constraints
    - effect: allow
      actions:
        - ticket.read
        - ticket.summarize
      constraints:
        maxRecords: 25
        redact:
          - payment_card
          - government_id
          - api_key
          - access_token

    # Allow reading customer data with redaction
    - effect: allow
      actions:
        - customer.read
      constraints:
        redact:
          - tax_identifier
          - billing_account
          - bank_account

    # External customer messaging must go through human approval first.
    - effect: require_approval
      actions:
        - message.send
      resources:
        types:
          - slack.channel
        owners:
          - channel:external
      approval:
        approvers:
          - group:support-managers
        minApprovals: 1
        expiresIn: 30m
      reason: "External customer updates require support manager approval"

    # Allow posting to internal support channels without approval.
    - effect: allow
      actions:
        - message.send
      resources:
        types:
          - slack.channel
        owners:
          - channel:internal

    # Allow creating escalation issues
    - effect: allow
      actions:
        - escalation.issue.create

    # Allow updating ticket status
    - effect: allow
      actions:
        - ticket.update
      constraints:
        allowedFields:
          - status
          - priority
          - assignee

    # Explicitly deny bulk exports
    - effect: deny
      actions:
        - ticket.bulk_export
        - customer.bulk_export
      reason: "Bulk export is prohibited — data exfiltration risk"

    # Explicitly deny destructive actions
    - effect: deny
      actions:
        - customer.delete
        - policy.modify
        - repository.settings.modify
      reason: "Destructive or administrative actions are prohibited"
