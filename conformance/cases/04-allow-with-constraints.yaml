# Conformance Test 04: Allow With Constraints
# Validates: Constraint model — allowed actions can carry restrictions.

name: allow-with-constraints
description: An allowed action must carry constraints from the matching policy.

agents:
  - apiVersion: oap.dev/v1alpha1
    kind: Agent
    metadata:
      name: invoice-reconciler
      namespace: finance
    spec:
      owner: group:finance-platform
      type: workflow_agent
      riskTier: medium
      capabilities:
        - erp.invoice.read
    status:
      state: active

policies:
  - apiVersion: oap.dev/v1alpha1
    kind: AgentPolicy
    metadata:
      name: finance-invoice-readonly
      namespace: finance
    spec:
      subject:
        agent: agent://finance/invoice-reconciler
      rules:
        - effect: allow
          actions:
            - erp.invoice.read
          resources:
            types:
              - erp.invoice
          constraints:
            readonly: true
            maxRecords: 25
            redact:
              - bank_account_number
              - tax_identifier
            expiresIn: 15m

request:
  request_id: req_test04
  timestamp: "2026-05-25T08:00:00Z"
  subject:
    type: agent
    agent_id: agent://finance/invoice-reconciler
  action:
    name: erp.invoice.read
  resource:
    type: erp.invoice
    id: INV-001

expected:
  decision: allow_with_constraints
  constraints:
    readonly: true
    maxRecords: 25
    redact:
      - bank_account_number
      - tax_identifier
