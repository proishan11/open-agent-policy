apiVersion: oap.dev/v1alpha1
kind: AgentPolicy
metadata:
  name: support-agent-policy
  namespace: support
spec:
  subject:
    agent: "agent://support/support-ticket-agent"
  rules:
    # Allow reading tickets with a cap on results
    - effect: allow
      actions:
        - tickets.read
        - tickets.list
      constraints:
        maxRecords: 10
        readonly: true

    # Allow updating ticket status and priority
    - effect: allow
      actions:
        - tickets.update
      constraints:
        allowedFields:
          - status
          - priority
          - assignee

    # Allow reading customer data, but redact sensitive fields
    - effect: allow
      actions:
        - customers.read
      constraints:
        readonly: true
        redact:
          - ssn
          - credit_card
          - bank_account
        maxRecords: 5

    # Allow escalation. Priority checks are enforced by the ticket API until
    # OAP has first-class resource attribute conditions.
    - effect: allow
      actions:
        - tickets.escalate

    # Sending email requires approval. Recipient-based policy needs resource
    # attribute conditions, which are intentionally not implied by this rule.
    - effect: require_approval
      actions:
        - notifications.send_email
      approval:
        approvers:
          - "group:support-leads"
        minApprovals: 1
        expiresIn: 30m
      reason: "Email notifications require support lead approval"

    # Explicitly deny ticket deletion — no exceptions
    - effect: deny
      actions:
        - tickets.delete
      reason: "Support agents may not delete tickets — compliance requirement"

    # Explicitly deny access to billing/payment data
    - effect: deny
      actions:
        - billing.read
        - billing.update
        - payments.read
        - payments.refund
      reason: "Support agents do not have access to billing systems"
