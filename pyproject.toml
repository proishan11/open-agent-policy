[project]
name = "open-agent-policy"
description = "Zero-trust access control for AI agents"
version = "0.1.0-alpha"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ishan Singh"}]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T20",  # flake8-print
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "ERA",  # eradicate (commented-out code)
  "RUF",  # ruff-specific rules
]
ignore = [
  "S101",   # assert allowed in tests
  "T201",   # print allowed in demos/scripts
]

[tool.ruff.lint.per-file-ignores]
"demos/**" = ["T201", "S101"]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "sdk/python/tests"]
pythonpath = ["sdk/python"]

[tool.coverage.run]
source = ["open_agent_policy"]

[tool.coverage.report]
show_missing = true
fail_under = 80
