[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-agent-policy"
version = "0.1.0a1"
description = "Python SDK for Open Agent Policy — zero-trust access control for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ishan Singh"}]
keywords = ["ai", "agents", "security", "authorization", "policy", "langchain", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/proishan11/open-agent-policy"
Documentation = "https://github.com/proishan11/open-agent-policy/tree/main/sdk/python"
Repository = "https://github.com/proishan11/open-agent-policy"
Issues = "https://github.com/proishan11/open-agent-policy/issues"

[tool.hatch.build.targets.wheel]
packages = ["open_agent_policy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "RET", "SIM", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
